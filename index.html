<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kanban Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">▦</span>
      <div class="brand__text">
        <h1 class="brand__title">Kanban</h1>
     
      </div>
    </div>
    <div class="topbar__actions">
      <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by priority">
        <button type="button" class="filter-btn is-active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="low">Low</button>
        <button type="button" class="filter-btn" data-filter="medium">Medium</button>
        <button type="button" class="filter-btn" data-filter="high">High</button>
      </div>
      <button type="button" class="btn-add" id="add-task-btn" aria-label="New task">+</button>
    </div>
  </header>

  <main class="board" id="board" aria-live="polite">
   
  </main>


  <div class="modal-overlay" id="task-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal__header">
        <h2 id="modal-title">New Task</h2>
        <button type="button" class="modal__close" id="modal-close" aria-label="Close">✕</button>
      </div>
      <form id="task-form" novalidate>
        <div class="field">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" name="title" maxlength="80" required autocomplete="off" />
        </div>
        <div class="field">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" name="description" maxlength="300" placeholder="Optional details..."></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="task-due">Due date</label>
            <input type="date" id="task-due" name="dueDate" />
          </div>
        </div>
        <div class="field">
          <label for="task-status">Column</label>
          <select id="task-status" name="status">
            <option value="todo">To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary" id="modal-save">Save Task</button>
        </div>
      </form>
    </div>
  </div>


  <div class="modal-overlay" id="confirm-modal">
    <div class="modal modal--small" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal__header">
        <h2 id="confirm-title">Delete task</h2>
      </div>
      <p id="confirm-text" style="color: var(--text-muted); font-size: 0.88rem; margin: 0 0 1.2rem;"></p>
      <div class="modal__actions">
        <button type="button" class="btn-ghost" id="confirm-cancel">Cancel</button>
        <button type="button" class="btn-danger" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    Made with <strong>♥</strong> 
by Route Academy
  </footer>

  <script src="script.js"></script>
</body>
</html>
